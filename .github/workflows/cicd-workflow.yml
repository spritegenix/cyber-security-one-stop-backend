name: Build and Deploy Docker Image
on:
  push:
    branches: [main]

env:
  IMAGE_NAME: spritegenix/cyber-sec-backend
  CONTAINER_NAME: cyber-sec-backend
  NODE_ENV: development

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Decode and Create .env File
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
        run: |
          if [ -n "$ENV_FILE_B64" ]; then
            echo "$ENV_FILE_B64" | base64 --decode > .env
          else
            echo "Warning: ENV_FILE_B64 secret not found"
          fi

      - name: Build Docker Image
        run: |
          docker build --no-cache -t ${{ env.IMAGE_NAME }}:latest .
          echo "Image built successfully"

      - name: Run Docker Container for Testing
        run: |
          # Remove any existing test container
          docker rm -f test-container 2>/dev/null || true

          # Run container with health check - using /health endpoint since it exists
          docker run -d \
            --network=host \
            --name test-container \
            -p 4000:4000 \
            --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1" \
            --health-interval=15s \
            --health-timeout=10s \
            --health-retries=5 \
            --health-start-period=90s \
            ${{ env.IMAGE_NAME }}:latest

          echo "Container started, waiting for initialization..."

      - name: Show Initial Container Status
        run: |
          echo "=== Initial Container Status ==="
          docker ps -a | grep test-container || echo "Container not found"
          sleep 5
          echo "=== Initial Container Logs ==="
          docker logs test-container || echo "No logs available yet"

      - name: Wait for Database and GraphQL Setup
        run: |
          echo "Waiting 30 seconds for database connection and GraphQL server setup..."
          sleep 30

          echo "=== Container Logs After Database Wait ==="
          docker logs test-container

          echo "=== Container Process Status ==="
          docker exec test-container ps aux 2>/dev/null || echo "ps command failed"

          echo "=== Check available tools ==="
          docker exec test-container which wget 2>/dev/null && echo "✅ wget available" || echo "❌ wget not found"
          docker exec test-container which curl 2>/dev/null && echo "✅ curl available" || echo "❌ curl not found"

      - name: Test Health Check Manually
        run: |
          echo "=== Testing Health Endpoints Manually ==="

          # Test with wget first
          echo "Testing health endpoint with wget:"
          docker exec test-container wget --no-verbose --tries=1 --spider http://localhost:4000/health 2>&1 || echo "wget health test failed with exit code $?"

          # Test root endpoint with wget
          echo "Testing root endpoint with wget:"
          docker exec test-container wget --no-verbose --tries=1 --spider http://localhost:4000/ 2>&1 || echo "wget root test failed with exit code $?"

          # Test from host network with curl (if available on host)
          echo "Testing from host network:"
          curl -v http://localhost:4000/health 2>&1 && echo "✅ Host health test passed" || echo "❌ Host health test failed"
          curl -v http://localhost:4000/ 2>&1 && echo "✅ Host root test passed" || echo "❌ Host root test failed"

      - name: Wait for Container Health Check
        run: |
          # Wait up to 180 seconds for container to be healthy (increased for GraphQL startup)
          timeout=180
          while [ $timeout -gt 0 ]; do
            status=$(docker inspect --format='{{.State.Health.Status}}' test-container 2>/dev/null || echo "no-health")
            
            echo "Current health status: $status (${timeout}s remaining)"
            
            if [ "$status" = "healthy" ]; then
              echo "✅ Container is healthy!"
              break
            elif [ "$status" = "unhealthy" ]; then
              echo "❌ Container failed health check"
              echo "=== Health Check Details ==="
              docker inspect --format='{{json .State.Health}}' test-container 2>/dev/null | jq . || docker inspect --format='{{json .State.Health}}' test-container
              echo "=== Final Container Logs ==="
              docker logs test-container
              exit 1
            fi
            
            # Show logs every 30 seconds for debugging
            if [ $((timeout % 30)) -eq 0 ]; then
              echo "=== Current Container Logs ==="
              docker logs test-container --tail=10
            fi
            
            sleep 10
            timeout=$((timeout-10))
          done

          if [ $timeout -le 0 ]; then
            echo "❌ Timeout waiting for container to be healthy"
            echo "=== Health Check Details ==="
            docker inspect --format='{{json .State.Health}}' test-container 2>/dev/null | jq . || docker inspect --format='{{json .State.Health}}' test-container
            echo "=== Final Container Logs ==="
            docker logs test-container
            exit 1
          fi

      - name: Test Container Endpoints
        run: |
          echo "=== Final Endpoint Tests ==="

          # Test health endpoint from host
          if ! curl -f http://localhost:4000/health; then
            echo "❌ Health endpoint test failed"
            docker logs test-container
            exit 1
          fi

          # Test root endpoint from host
          if ! curl -f http://localhost:4000/; then
            echo "❌ Root endpoint test failed"
            docker logs test-container
            exit 1
          fi

          # Test GraphQL endpoint (should return Method Not Allowed for GET)
          echo "Testing GraphQL endpoint (expecting 405 or GraphQL response):"
          curl -v http://localhost:4000/graphql 2>&1 || echo "GraphQL endpoint test completed"

          echo "✅ Container tests passed!"

      - name: Get Detailed Health Check Info
        if: failure()
        run: |
          echo "=== Detailed Health Check Information ==="
          docker inspect --format='{{json .State.Health}}' test-container 2>/dev/null | jq . || docker inspect --format='{{json .State.Health}}' test-container

          echo "=== Container State ==="
          docker inspect --format='{{json .State}}' test-container 2>/dev/null | jq . || docker inspect --format='{{json .State}}' test-container

          echo "=== Environment Variables ==="
          docker exec test-container env 2>/dev/null || echo "Cannot get environment variables"

      - name: List All Containers on Failure
        if: failure()
        run: |
          echo "=== All Containers ==="
          docker ps -a

      - name: Capture Final Container Logs on Failure
        if: failure()
        run: |
          echo "=== Final Container Logs ==="
          docker logs test-container 2>&1 || echo "No logs found for test-container"

      - name: Stop and Remove Test Container
        if: always()
        run: |
          docker stop test-container 2>/dev/null || true
          docker rm test-container 2>/dev/null || true

      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "Image pushed successfully"

      - name: Cleanup
        if: always()
        run: |
          rm -f .env
          docker system prune -f

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull Latest Docker Image
        run: |
          docker pull ${{ env.IMAGE_NAME }}:latest
          echo "Image pulled successfully"

      - name: Stop and Remove Existing Container
        run: |
          if docker ps -q -f name=${{ env.CONTAINER_NAME }}; then
            echo "Stopping existing container..."
            docker stop ${{ env.CONTAINER_NAME }}
          fi
          if docker ps -aq -f name=${{ env.CONTAINER_NAME }}; then
            echo "Removing existing container..."
            docker rm ${{ env.CONTAINER_NAME }}
          fi

      - name: Deploy New Container
        run: |
          docker run -d \
            --network=host \
            --name ${{ env.CONTAINER_NAME }} \
            --restart unless-stopped \
            --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1" \
            --health-interval=15s \
            --health-timeout=10s \
            --health-retries=5 \
            --health-start-period=90s \
            ${{ env.IMAGE_NAME }}:latest

          echo "Container deployed successfully"

      - name: Debug Deployment
        run: |
          echo "=== Deployment Debug Info ==="
          echo "Container status:"
          docker ps -a | grep ${{ env.CONTAINER_NAME }}

          echo "Waiting 30 seconds for app initialization..."
          sleep 30

          echo "Container logs:"
          docker logs ${{ env.CONTAINER_NAME }}

      - name: Verify Deployment
        run: |
          echo "Verifying deployment..."

          # Check if container is running
          if [ "$(docker inspect -f '{{.State.Running}}' ${{ env.CONTAINER_NAME }})" != "true" ]; then
            echo "❌ Deployment failed: Container is not running"
            docker logs ${{ env.CONTAINER_NAME }}
            exit 1
          fi

          # Wait for health check
          timeout=120
          while [ $timeout -gt 0 ]; do
            status=$(docker inspect --format='{{.State.Health.Status}}' ${{ env.CONTAINER_NAME }} 2>/dev/null || echo "starting")
            
            echo "Container health status: $status (${timeout}s remaining)"
            
            if [ "$status" = "healthy" ]; then
              echo "✅ Deployment successful! Container is healthy and running."
              
              # Final connectivity tests
              echo "=== Final Connectivity Tests ==="
              curl -f http://localhost:4000/health && echo "✅ Health endpoint is accessible" || echo "⚠️  Health endpoint test failed"
              curl -f http://localhost:4000/ && echo "✅ Root endpoint is accessible" || echo "⚠️  Root endpoint test failed"
              
              break
            elif [ "$status" = "unhealthy" ]; then
              echo "❌ Deployment failed: Container is unhealthy"
              echo "=== Health Check Details ==="
              docker inspect --format='{{json .State.Health}}' ${{ env.CONTAINER_NAME }} 2>/dev/null | jq . || docker inspect --format='{{json .State.Health}}' ${{ env.CONTAINER_NAME }}
              echo "=== Container Logs ==="
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi
            
            # Show logs every 30 seconds
            if [ $((timeout % 30)) -eq 0 ]; then
              echo "=== Current Container Logs ==="
              docker logs ${{ env.CONTAINER_NAME }} --tail=10
            fi
            
            sleep 10
            timeout=$((timeout-10))
          done

          if [ $timeout -le 0 ]; then
            echo "❌ Deployment timeout: Container didn't become healthy"
            echo "=== Health Check Details ==="
            docker inspect --format='{{json .State.Health}}' ${{ env.CONTAINER_NAME }} 2>/dev/null | jq . || docker inspect --format='{{json .State.Health}}' ${{ env.CONTAINER_NAME }}
            echo "=== Container Logs ==="
            docker logs ${{ env.CONTAINER_NAME }}
            exit 1
          fi

      - name: Cleanup Old Images
        run: |
          docker image prune -f
          echo "Cleanup completed"
