name: Build and Deploy Docker Image
on:
  push:
    branches: [main]
env:
  IMAGE_NAME: spritegenix/cyber-sec-backend
  CONTAINER_NAME: cyber-sec-backend
  NODE_ENV: development
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Decode and Create .env File
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_B64 }}
        run: |
          if [ -n "$ENV_FILE_B64" ]; then
            echo "$ENV_FILE_B64" | base64 --decode > .env
          else
            echo "Warning: ENV_FILE_B64 secret not found"
          fi
      - name: Build Docker Image
        run: |
          docker build --no-cache -t ${{ env.IMAGE_NAME }}:latest .
          echo "Image built successfully"
      - name: Run Docker Container for Testing
        run: |
          # Remove any existing test container
          docker rm -f test-container 2>/dev/null || true
          # Run container with health check
          docker run -d \
            --network=host \
            --name test-container \
            -p 4000:4000 \
            --health-cmd="wget --no-verbose --tries=1 --spider http://localhost:4000/health || exit 1" \
            --health-interval=15s \
            --health-timeout=10s \
            --health-retries=5 \
            --health-start-period=90s \
            ${{ env.IMAGE_NAME }}:latest
          echo "Container started, waiting for initialization..."
      - name: Wait for Container Health Check
        run: |
          # Wait up to 180 seconds for container to be healthy
          timeout=180
          while [ $timeout -gt 0 ]; do
            status=$(docker inspect --format='{{.State.Health.Status}}' test-container 2>/dev/null || echo "no-health")
            
            echo "Current health status: $status (${timeout}s remaining)"
            
            if [ "$status" = "healthy" ]; then
              echo "✅ Container is healthy!"
              break
            elif [ "$status" = "unhealthy" ]; then
              echo "❌ Container failed health check"
              docker logs test-container
              exit 1
            fi
            
            sleep 10
            timeout=$((timeout-10))
          done
          if [ $timeout -le 0 ]; then
            echo "❌ Timeout waiting for container to be healthy"
            docker logs test-container
            exit 1
          fi
      - name: Test Container Endpoints
        run: |
          echo "=== Final Endpoint Tests ==="
          # Test health endpoint
          if ! curl -f http://localhost:4000/health; then
            echo "❌ Health endpoint test failed"
            docker logs test-container
            exit 1
          fi
          echo "✅ Container tests passed!"
      - name: Stop and Remove Test Container
        if: always()
        run: |
          docker stop test-container 2>/dev/null || true
          docker rm test-container 2>/dev/null || true
      - name: Push Docker Image to Docker Hub
        run: |
          docker push ${{ env.IMAGE_NAME }}:latest
          echo "Image pushed successfully"
      - name: Cleanup
        if: always()
        run: |
          rm -f .env
          docker system prune -f

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
            docker stop cyber-sec-backend || true
            docker rm cyber-sec-backend || true
            docker pull spritegenix/cyber-sec-backend:latest
            docker run -d --network=host --name cyber-sec-backend --restart unless-stopped spritegenix/cyber-sec-backend:latest
            sleep 10
            docker ps | grep cyber-sec-backend
            echo "✅ Deployment successful!"
      - name: Cleanup Old Images
        run: |
          docker image prune -f
          echo "Cleanup completed"
